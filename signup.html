<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Pavlo Myskov">
    <meta name="description" content="Create account">

    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">

    <title>Sign Up</title>
  </head>

  <body class="auth-page">
    <header class="sticky">
      <nav class="navbar">
        <div class="logo-container">
          <a href="index.html">
            <img
              class="logo-image"
              src="assets/images/logo.png"
              alt="barber shop nav logo"
          >
          </a>
        </div>

        <ul class="menu-list">
          <li class="brush-stroke"><a href="index.html">HOME</a></li>
          <li class="brush-stroke"><a href="booknow.html">PRICE</a></li>
          <li class="brush-stroke"><a href="gallery.html">GALLERY</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="account-container">
        <div class="account-panel account-single">
          <div class="account-auth">
            <h2>Create Account</h2>
            <p class="account-status" aria-live="polite"></p>

            <form class="auth-form" id="signup-form">
              <input type="text" id="signup-name" placeholder="Full Name" required>
              <input type="email" id="signup-email" placeholder="Email" required>
              <input type="password" id="signup-password" placeholder="Password" required>
              <button type="submit">Sign Up</button>
            </form>

            <p class="auth-help">Already have an account? <a class="auth-link-inline" href="login.html">Sign in</a></p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://kit.fontawesome.com/c7dbda0798.js" crossorigin="anonymous"></script>
    <script type="module" src="assets/js/auth.js"></script>
  </body>
</html>
